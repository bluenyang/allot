# Allot production example: the released image only; PostgreSQL 16 is yours (DATABASE_URL).
#   cp docker/.env.example docker/.env   # DATABASE_URL, BETTER_AUTH_*, production section
#   docker compose -f docker/compose.prod.yaml up -d
# Migrations are applied when the app starts. First data: see README ("운영 배포").
name: allot

services:
  app:
    image: ghcr.io/bluenyang/allot:${ALLOT_VERSION:-latest}
    env_file: [.env]
    # Loopback by default: a reverse proxy on this host reaches it, nothing else does.
    # Set APP_BIND=0.0.0.0 only when clients connect to the app directly — and then keep
    # TRUSTED_PROXY_IP_HEADER empty, or anyone could pick their own rate-limit bucket.
    ports: ["${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"]
    restart: unless-stopped
