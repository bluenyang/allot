# The staging stack on :15173 (the user's real data): a BUILT snapshot of one commit, run with node — not the
# working tree (retro 0.1.7, user: "빌드해서 노드로 올려두는 식으로"). `scripts/test-server/stage.sh [<commit>]` checks the
# commit out with `git archive` into .loctx/staging/<sha>/, builds it inside the dev image (vite build, build:server),
# backs up the database and points .loctx/staging/current at it; this file mounts only that snapshot. Editing or
# switching the main checkout changes nothing here. Also PostgreSQL 16 and Dex as a test OIDC provider (reached through
# the web proxy at /dex). Values from docker/.env.dev (gitignored; copy docker/.env.example and fill in test values).
#   bash scripts/test-server/stage.sh            (never `up --build` by hand: the image only gives node and pnpm)
# The production example is docker/compose.yaml (the released image).
name: allot-dev

services:
  web:
    build: { context: .., dockerfile: docker/Dockerfile }
    # `vite preview` serves only the snapshot's built dist/ (with the same /api and /dex proxy as the dev server).
    # Writable: Vite writes its bundled config next to vite.config.ts.
    command: ["/stage/node_modules/.bin/vite", "preview", "--host", "0.0.0.0", "--port", "15173", "--strictPort"]
    working_dir: /stage
    ports: ["0.0.0.0:15173:15173"]
    env_file: [.env.dev]
    environment:
      API_URL: http://api:3000
      DEX_URL: http://dex:5556
    volumes:
      - ../.loctx/staging/current:/stage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:15173/ >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 30
    # Not api healthy: the api's first build fetches OIDC discovery through this proxy (/dex),
    # so waiting for it would be circular (review 1, R5). The api retries discovery if early.
    depends_on:
      api: { condition: service_started }
      dex: { condition: service_healthy }

  api:
    build: { context: .., dockerfile: docker/Dockerfile }
    # The snapshot's bundled server, as the production image runs it (migrations from its drizzle/ at start).
    command: ["node", "dist-server/index.mjs"]
    working_dir: /stage
    environment:
      # Only the web service (Vite proxy) reaches the api, and it overwrites this header.
      TRUSTED_PROXY_IP_HEADER: x-allot-client-ip
    env_file: [.env.dev]
    volumes:
      - ../.loctx/staging/current:/stage:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      db: { condition: service_healthy }
    # no ports: only the web service (Vite proxy) reaches it

  db:
    image: postgres:16.15-alpine3.24
    env_file: [.env.dev]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Test OIDC provider (spec 006 W-9). Fake users and client only: docker/dex/config.yaml.
  # Its issuer is BETTER_AUTH_URL + /dex, which the browser and the api both reach through the
  # web service; Dex itself publishes no port.
  dex:
    image: ghcr.io/dexidp/dex:v2.46.1
    command: ["dex", "serve", "/etc/dex/allot.yaml"]
    env_file: [.env.dev]
    volumes:
      - ./dex/config.yaml:/etc/dex/allot.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5556/dex/.well-known/openid-configuration >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
