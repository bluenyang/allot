# Allot development stack.
#   cp docker/.env.example docker/.env   # fill in real values
#   docker compose -f docker/compose.yaml up -d --build -V   # -V: fresh node_modules after dependency changes
#   open http://<this machine>:15173 (published on all interfaces, LAN included)
name: allot

services:
  web:
    build: { context: .., dockerfile: docker/Dockerfile }
    command: ["pnpm", "exec", "vite", "--host", "0.0.0.0", "--port", "15173", "--strictPort"]
    ports: ["0.0.0.0:${WEB_PORT:-15173}:15173"]
    env_file: [{ path: .env, required: false }]
    environment:
      API_URL: http://api:3000
    # Vite serves every file under its root to anyone on the LAN, so the web container
    # gets only the front end — never .loctx/, server/, tests/ or docker/.
    volumes:
      - ../index.html:/app/index.html:ro
      - ../vite.config.ts:/app/vite.config.ts:ro
      - ../tsconfig.json:/app/tsconfig.json:ro
      - ../src:/app/src:ro
      - /app/node_modules  # anonymous: renewed from the image by `up --build -V`
    depends_on:
      api: { condition: service_healthy }

  api:
    build: { context: .., dockerfile: docker/Dockerfile }
    command: ["pnpm", "exec", "tsx", "watch", "server/index.ts"]
    env_file: [{ path: .env, required: false }]
    volumes:
      - ..:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      db: { condition: service_healthy }
    # no ports: only the web service (Vite proxy) reaches it

  db:
    image: postgres:16.15-alpine3.24
    env_file: [{ path: .env, required: false }]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    # no ports: reachable only inside the compose network

volumes:
  pgdata:
