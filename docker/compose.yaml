# Allot production example: the released image only; PostgreSQL 16 is yours (DATABASE_URL).
# Local development and tests use docker/compose.dev.yaml instead.
#   cp docker/.env.example docker/.env   # DATABASE_URL, BETTER_AUTH_*, TRUSTED_ORIGINS, production section
#   docker compose -f docker/compose.yaml up -d
# Migrations are applied when the app starts. First data and the database role: README ("운영 배포").
#
# HTTPS through Traefik (a Traefik that already runs on this host, docker provider): the app
# publishes no port and joins Traefik's network; Traefik terminates TLS for ALLOT_HOST.
# Traefik sets X-Real-Ip from the client address, so TRUSTED_PROXY_IP_HEADER=X-Real-IP is
# right here, as long as only Traefik can reach the app (no published port) and Traefik's
# entrypoint does not trust forwarded headers from the internet.
name: allot

services:
  app:
    image: ghcr.io/bluenyang/allot:${ALLOT_VERSION:-latest}
    env_file: [.env]
    restart: unless-stopped
    # Least privilege: nothing on disk changes at run time, no Linux capabilities needed.
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [proxy]
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik}
      traefik.http.routers.allot.rule: Host(`${ALLOT_HOST:?set ALLOT_HOST}`)
      traefik.http.routers.allot.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.allot.tls: "true"
      traefik.http.routers.allot.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-letsencrypt}
      traefik.http.services.allot.loadbalancer.server.port: "3000"
    # Without Traefik: remove `networks` and `labels`, and publish on loopback for a proxy on
    # this host (keep TRUSTED_PROXY_IP_HEADER to the header that proxy overwrites), or on
    # 0.0.0.0 for direct clients (then TRUSTED_PROXY_IP_HEADER must stay empty):
    # ports: ["${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"]

networks:
  # Traefik's network, created outside this file. If PostgreSQL runs in a container on another
  # network, add that network here and to the service as well.
  proxy:
    name: ${TRAEFIK_NETWORK:-traefik}
    external: true
