# Release: container image on GHCR + GitHub Release draft (run by hand).
#
# Actions → "Allot Release" → Run workflow
#   - release_type: patch | minor | major | rc (ignored when `version` is set)
#   - version: exact semver without a leading v (e.g. 0.1.0). Empty = bump package.json.
#   - version_suffix: prerelease id without a leading hyphen (e.g. rc.1). Empty = none.
#   - dry_run: check and build the image only — no commit, tag, push or draft.
#
# Order: resolve version → (only if it changed) commit package.json → tag → gates
#        → build and push ghcr.io/<owner>/allot (linux/amd64) → draft GitHub Release.
# Modelled on team-croffle/pipit-bot's release workflow.

name: Allot Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Version bump kind (ignored when `version` is set)
        required: true
        type: choice
        options: [patch, minor, major, rc]
        default: patch
      version:
        description: Exact version without leading v (e.g. 0.1.0). Leave empty to bump.
        required: false
        type: string
        default: ''
      version_suffix:
        description: Prerelease suffix without leading hyphen (e.g. rc.1). Empty = none.
        required: false
        type: string
        default: ''
      dry_run:
        description: Check and build only (no commit, tag, image push or draft)
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: allot-release
  cancel-in-progress: false

env:
  NODE_VERSION: '26'
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}
      tag: ${{ steps.calc.outputs.tag }}
      ref: ${{ steps.commit.outputs.ref }}
      is_prerelease: ${{ steps.calc.outputs.is_prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Calculate version
        id: calc
        shell: bash
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          INPUT_VERSION: ${{ inputs.version }}
          VERSION_SUFFIX: ${{ inputs.version_suffix }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          CURRENT=$(node -p "require('./package.json').version")
          echo "Current package version: $CURRENT"
          CORE=$(node -e "const v=process.argv[1].split(/[-+]/)[0]; if(!/^\d+\.\d+\.\d+$/.test(v)) process.exit(1); console.log(v)" "$CURRENT")

          if [[ -n "$INPUT_VERSION" ]]; then
            NEXT="${INPUT_VERSION#v}"
          else
            case "$RELEASE_TYPE" in
              major|minor|patch)
                NEXT=$(node -e "const [a,b,c]=process.argv[1].split('.').map(Number);const k=process.argv[2];console.log(k==='major'?\`\${a+1}.0.0\`:k==='minor'?\`\${a}.\${b+1}.0\`:\`\${a}.\${b}.\${c+1}\`)" "$CORE" "$RELEASE_TYPE") ;;
              rc)
                if [[ "$CURRENT" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-rc\.([0-9]+)$ ]]; then
                  NEXT="${BASH_REMATCH[1]}-rc.$((BASH_REMATCH[2] + 1))"
                else
                  NEXT="$(node -e "const [a,b,c]=process.argv[1].split('.').map(Number);console.log(\`\${a}.\${b}.\${c+1}\`)" "$CORE")-rc.1"
                fi ;;
              *) echo "Unknown release_type: $RELEASE_TYPE" >&2; exit 1 ;;
            esac
          fi
          if [[ -n "$VERSION_SUFFIX" ]]; then
            NEXT="${NEXT%%-*}-${VERSION_SUFFIX#-}"
          fi
          if [[ ! "$NEXT" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Computed version looks invalid: $NEXT" >&2; exit 1
          fi
          IS_PRE=false; [[ "$NEXT" == *-* ]] && IS_PRE=true
          TAG="v${NEXT}"
          echo "Resolved $NEXT (tag $TAG, prerelease=$IS_PRE, dry_run=$DRY_RUN)"
          if [[ "$DRY_RUN" != "true" ]] && git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "::error::Tag ${TAG} already exists on origin."; exit 1
          fi
          { echo "version=$NEXT"; echo "tag=$TAG"; echo "is_prerelease=$IS_PRE"; echo "current=$CURRENT"; } >> "$GITHUB_OUTPUT"

      - name: Commit version (only if it changed), tag, push
        id: commit
        shell: bash
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          NEW_VERSION: ${{ steps.calc.outputs.version }}
          CURRENT: ${{ steps.calc.outputs.current }}
          TAG: ${{ steps.calc.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "dry_run — no commit, tag or push"; echo "ref=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ "$NEW_VERSION" != "$CURRENT" ]]; then
            node -e "const f='package.json',fs=require('fs'),p=JSON.parse(fs.readFileSync(f,'utf8'));p.version=process.argv[1];fs.writeFileSync(f,JSON.stringify(p,null,2)+'\n')" "$NEW_VERSION"
            git add package.json
            git commit -m "release: v${NEW_VERSION}"
            for attempt in 1 2 3; do
              git push origin "HEAD:${GITHUB_REF_NAME}" && break
              [[ $attempt -eq 3 ]] && { echo "branch push failed" >&2; exit 1; }
              git pull --rebase origin "${GITHUB_REF_NAME}"
            done
          else
            echo "package.json already at ${NEW_VERSION} — no version commit"
          fi
          git tag -a "$TAG" -m "Allot ${NEW_VERSION}"
          git push origin "$TAG"
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  gates:
    name: Gates (typecheck, build)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}
      - name: Setup pnpm (version from package.json packageManager)
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm build:server

  publish:
    name: Push image and draft release
    needs: [version, gates]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ inputs.dry_run != true }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=${{ needs.version.outputs.tag }}
            type=raw,value=latest,enable=${{ needs.version.outputs.is_prerelease == 'false' }}

      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ inputs.dry_run != true }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create draft GitHub Release
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          IS_PRE: ${{ needs.version.outputs.is_prerelease }}
          IMAGE: ${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016  # the backticks are Markdown, not command substitution
          NOTES=$(printf 'Image: `%s:%s` (linux/amd64)\n\n```sh\ndocker pull %s:%s\n```\n\nSee CHANGELOG.md.\n' "$IMAGE" "$VERSION" "$IMAGE" "$VERSION")
          ARGS=(--draft --title "v$VERSION" --notes "$NOTES")
          [[ "$IS_PRE" == "true" ]] && ARGS+=(--prerelease)
          gh release create "$TAG" "${ARGS[@]}" --repo "$GITHUB_REPOSITORY"
