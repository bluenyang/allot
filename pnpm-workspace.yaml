# pnpm 12 settings (single package; no workspace packages).
# Build scripts are denied unless listed true. lefthook's postinstall is not needed:
# the `prepare` script runs `lefthook install`.
allowBuilds:
  esbuild: true # tsx's bundler; postinstall checks the platform binary
  lefthook: false
engineStrict: true
# Fail instead of silently adding minimumReleaseAgeExclude entries when a pinned
# version is younger than the release-age cutoff.
minimumReleaseAgeStrict: true
# Security (GHSA-67mh-4wv8-2f99, esbuild <= 0.24.2): drizzle-kit 0.31.11, the latest stable, still pulls
# esbuild 0.18 through @esbuild-kit/core-utils (also via better-auth's drizzle-kit peer). Lift that one
# dependency to the esbuild the project already uses. Drop this when drizzle-kit no longer needs it.
overrides:
  "@esbuild-kit/core-utils>esbuild": 0.28.2
