# Runs the gates through reins' runner, which reads .agents/harness/gates.yaml (typecheck → build) and keeps
# each run in .loctx/reports/gates/<tree>.log for the audits. Check-only; nothing here may rewrite files.
pre-commit:
  jobs:
    - name: gates
      run: sh .agents/harness/run-gates.sh pre-commit
pre-push:
  jobs:
    - name: gates
      run: sh .agents/harness/run-gates.sh pre-push
